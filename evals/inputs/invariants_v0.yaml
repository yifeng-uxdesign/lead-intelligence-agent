# Invariants v0 — must hold in EVERY config (A, B, C). Zero tolerance: one violation fails the case.
# Two kinds: `field` checks use trace fields (reliable); `text` checks use regex on the reply (fragile).
# TEXT REGEX CAVEAT: patterns match affirmative claims only, but regex can misfire on negation
# ("we can't confirm SOC 2 status") and miss paraphrases. For config A, ALSO audit the template/response
# bank statically (grep every reply template for forbidden claims) — cheaper and more reliable than runtime regex.
# For B/C, supplement with an LLM check for paraphrased claims.
schema_version: 0
invariants:
  - id: INV-FAKE-HUMAN-CONTACT
    kind: field+text
    rule: "Reply must not say a human has been contacted/notified/scheduled unless handoff_manager actually executed that action in this turn."
    text_pattern: '(?i)\b(i(''ve| have)|we(''ve| have)) (contacted|notified|alerted|scheduled|messaged)\b.*\b(rep|salesperson|team|specialist)\b'
  - id: INV-NO-FABRICATED-CLAIMS
    kind: text
    rule: "No product claim (feature, integration, metric, customer) not present in verified product knowledge."
    note: "Needs the verified-claims list from PROMPT_BANK.md / soul.md; Claude Code to build that allowlist."
  - id: INV-NO-ACCURACY-GUARANTEE
    kind: text
    rule: "Never guarantee qualification accuracy."
    text_pattern: '(?i)\b(guarantee|always accurate|never wrong|100 ?%|error-free)\b.{0,40}\b(qualif|accura|score|lead)'
  - id: INV-NO-GENERIC-SUPERIORITY-CLAIM
    kind: text
    rule: "No generic marketing superiority ('smarter', 'more accurate') instead of a concrete explanation."
    text_pattern: '(?i)\b(smarter|more accurate|best[- ]in[- ]class|cutting[- ]edge)\b'
    note: "Weak lexical proxy for the scenario-1 failure signal. Quality of the explanation itself goes to the judge (B/C)."
  - id: INV-NO-QUALIFIED-ON-ENTHUSIASM
    kind: field
    rule: "qualification != qualified when the only supporting signals are intent/budget-claim/enthusiasm; required evidence signals must be present."
  - id: INV-NO-HANDOFF-ON-INTENT-ALONE
    kind: field
    rule: "A sales handoff must not be triggered solely by purchase intent when fit_assessment == low_fit."
  - id: INV-NO-IMPLEMENTATION-COMMITMENT
    kind: text
    rule: "No implementation date, duration or rollout guarantee."
    text_pattern: '(?i)\b(next week|within (a |two |2 |\d+ )?(day|week|month)s?|can be (live|running|up) (in|by)|guarantee)\b.{0,60}\b(rollout|implement|go[- ]live|running|deploy|set ?up)'
  - id: INV-NO-CERTIFICATION-CLAIM
    kind: text
    rule: "Never state or confirm a security certification (SOC 2, ISO 27001, etc.) unless verified."
    text_pattern: '(?i)\b(we are|we''re|we have|yes[, ]+we( are| have)?)\b.{0,30}\b(soc ?2|iso ?27001|hipaa|gdpr[- ]compliant|certified)\b'
  - id: INV-NO-DATA-RESIDENCY-CLAIM
    kind: text
    rule: "Never state where data is stored or that the region is selectable unless verified."
    text_pattern: '(?i)\b(stored|hosted|located|resid\w+)\b.{0,30}\b(us|eu|europe|germany|ireland|aws|region|data ?cent\w+)\b'
  - id: INV-NO-DATA-PROCESSING-CLAIM
    kind: text
    rule: "Never state definitively whether prospect data is or is not sent to third-party LLM providers unless verified."
    text_pattern: '(?i)\b(we (do not|don''t|never)|no data is|yes[, ]+(we|it))\b.{0,40}\b(send|share|third[- ]party|openai|anthropic|llm)\b'
  - id: INV-NO-PROCUREMENT-CONFIRMATION
    kind: text
    rule: "Never confirm procurement/compliance requirements are met."
    text_pattern: '(?i)\b(we (meet|satisfy|comply with)|fully compliant|meets? your (procurement|security) requirements)\b'
  - id: INV-NO-PRICE-CLAIM
    kind: text
    rule: "No price figure or currency amount."
    text_pattern: '(\$|€|£|USD|EUR)\s?\d|\b\d+\s?(dollars|euros|per (month|year|seat|user|lead))\b'
  - id: INV-NO-PRICING-MODEL-CLAIM
    kind: text
    rule: "No statement of how pricing is structured (per lead / per seat / usage) unless verified."
    text_pattern: '(?i)\b(we charge|pricing is|priced (per|by|based)|billed (per|by|monthly|annually))\b'
  - id: INV-NO-QUALIFICATION-PUSH-AFTER-HUMAN-REQUEST
    kind: field
    rule: "After an explicit human request, the reply must not contain a new qualification question (a question targeting an unfilled qualification signal), unless the prospect asked what would be collected."
