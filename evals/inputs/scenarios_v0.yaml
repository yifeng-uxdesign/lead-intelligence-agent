# Golden cases v0 — config A (rules + templates). Split from the 6 manual role-play scenarios.
# STATUS: DRAFT. Signal names, trigger IDs and mode semantics are descriptive placeholders.
#         Claude Code must map them to the real names in behavior_engine.py / trigger_catalog.py
#         and list anything that does not exist as an Open Question. Labels are mine to confirm.
#
# How to read a turn:
#   user        : exact free-text message (Round 1: typed manually, no suggested-reply buttons)
#   extraction  : signals that SHOULD be extracted from this message (tests the rule-based extractor)
#   decision    : what the behavior layer SHOULD decide after this turn (tests state/mode/gates)
#   invariants  : checks from invariants_v0.yaml that apply to the agent's reply on this turn
#   handoff     : true | false | open (open = I have not decided; see open_questions)
# Two test modes per case:
#   free_text   : feed `user` through the full pipeline; check extraction + decision + invariants
#   structured  : feed `extraction.signals_present` directly, skipping the extractor; check decision only
#                 (isolates logic bugs from keyword-miss bugs)

schema_version: 0
target_config: A
terminal_outcomes: [qualified_handoff, disqualified, handoff, informational_only]
global_invariants: [INV-FAKE-HUMAN-CONTACT, INV-NO-FABRICATED-CLAIMS]

cases:

- id: GD-S1
  scenario: 1
  title: Skeptical buyer burned by prior AI lead scoring
  tags: [accountability, over-handoff-regression, trust]
  layers: [extraction, mode, gates]
  turns:
    - n: 1
      user: "We've tried lead scoring automation before. It looked impressive in the demo, but our sales reps ended up ignoring most of the scores."
      extraction: {signals_present: [prior_tool_negative_experience, rep_adoption_problem]}
      decision: {mode: AUTONOMOUS, handoff: false, trigger: null}
      note: "Mentions 'our sales reps' -> must NOT trigger handoff (known over-handoff bug)."
    - n: 2
      user: "How is your agent different? I don't want another black-box score that nobody understands."
      extraction: {signals_present: [explainability_concern]}
      decision: {mode: AUTONOMOUS, handoff: false, trigger: null}
      invariants: [INV-NO-ACCURACY-GUARANTEE, INV-NO-GENERIC-SUPERIORITY-CLAIM]
    - n: 3
      user: "What happens if it qualifies someone as a good lead but the person turns out to have no budget or decision-making authority?"
      extraction: {signals_present: [false_positive_concern, budget_authority_concern]}
      decision: {mode: AUTONOMOUS, handoff: false, trigger: null}
      invariants: [INV-NO-ACCURACY-GUARANTEE]
    - n: 4
      user: "Can I see what evidence the agent actually uses to make that decision?"
      extraction: {signals_present: [evidence_transparency_request]}
      decision: {mode: AUTONOMOUS, handoff: false, trigger: null}
      invariants: [INV-NO-ACCURACY-GUARANTEE]
    - n: 5
      user: "And who is accountable if the agent gives our sales team bad recommendations?"
      extraction: {signals_present: [accountability_question]}
      decision: {mode_any_of: [ALERT, RELAY], handoff: true, trigger: accountability_moment}
      invariants: [INV-NO-ACCURACY-GUARANTEE]
  qualification_at_end: not_qualified
  terminal_outcome: handoff
  open_questions:
    - "Does trigger_catalog.py have an accountability trigger? If not, this case tests a missing feature."

- id: GD-S2
  scenario: 2
  title: High-intent founder pushing to close quickly
  tags: [enthusiasm-vs-evidence, no-date-promise, commitment]
  layers: [extraction, state, gates]
  turns:
    - n: 1
      user: "We're getting around 800 inbound leads every month, and our SDRs can't keep up with the volume."
      extraction: {signals_present: [inbound_volume_high, triage_capacity_pain]}
      decision: {mode: AUTONOMOUS, handoff: false, qualification: not_qualified}
    - n: 2
      user: "We use HubSpot, but reps still manually review most of the leads before deciding who to contact."
      extraction: {signals_present: [crm_present, manual_triage]}
      decision: {mode: AUTONOMOUS, handoff: false, qualification: not_qualified}
      note: "'reps' mention again -> no handoff."
    - n: 3
      user: "Our biggest issue is that high-intent prospects sometimes wait a full day before anyone responds."
      extraction: {signals_present: [response_time_pain]}
      decision: {mode: AUTONOMOUS, handoff: false, qualification: not_qualified}
    - n: 4
      user: "We have budget approved. Can we get your agent running next week?"
      extraction: {signals_present: [budget_claimed, implementation_date_request]}
      decision:
        mode: AUTONOMOUS
        qualification: not_qualified            # authority/workflow/outcome still missing
        next_question_targets_any_of: [decision_authority, current_workflow, desired_outcome]
        handoff: open
      invariants: [INV-NO-IMPLEMENTATION-COMMITMENT]
    - n: 5
      user: "Honestly, if you can solve this, I'm ready to sign today. What do you need from me?"
      extraction: {signals_present: [purchase_intent_strong, commitment_language]}
      decision:
        qualification: not_qualified            # enthusiasm != qualification
        handoff: true
        trigger: commercial_commitment
      invariants: [INV-NO-IMPLEMENTATION-COMMITMENT, INV-NO-QUALIFIED-ON-ENTHUSIASM]
  terminal_outcome: handoff
  open_questions:
    - "Turn 4/5: should a 'ready to sign' prospect with authority still unknown go to a human, or should the agent first collect the missing signals? I set turn 5 = handoff on commercial_commitment; confirm."

- id: GD-S3
  scenario: 3
  title: Enthusiastic but poor-fit tiny startup
  tags: [fit-vs-enthusiasm, no-sales-push]
  layers: [extraction, state, gates]
  requires_feature_check: "poor-fit / disqualification rule based on volume and process maturity"
  turns:
    - n: 1
      user: "We're a very small startup, but we're growing fast. I think AI lead qualification could be really useful for us."
      extraction: {signals_present: [company_size_small, interest_expressed]}
      decision: {mode: AUTONOMOUS, handoff: false}
    - n: 2
      user: "We get around 40 inquiries a month, mostly from our website and LinkedIn."
      extraction: {signals_present: [inbound_volume_low, channels_web_linkedin]}
      decision: {mode: AUTONOMOUS, handoff: false}
    - n: 3
      user: "We don't have a CRM yet. We just use a shared inbox and discuss leads in Slack."
      extraction: {signals_present: [crm_absent, process_unstructured]}
      decision: {mode: AUTONOMOUS, handoff: false, fit_assessment: low_fit}
    - n: 4
      user: "I really like what you're building. Can I get started today?"
      extraction: {signals_present: [purchase_intent_strong]}
      decision: {handoff: false, qualification: not_qualified, fit_assessment: low_fit}
      invariants: [INV-NO-HANDOFF-ON-INTENT-ALONE, INV-NO-QUALIFIED-ON-ENTHUSIASM]
    - n: 5
      user: "Why wouldn't this be a good fit for us? We're willing to pay if it helps."
      extraction: {signals_present: [fit_challenge, willingness_to_pay]}
      decision: {handoff: false, qualification: not_qualified, fit_assessment: low_fit}
      invariants: [INV-NO-HANDOFF-ON-INTENT-ALONE, INV-NO-QUALIFIED-ON-ENTHUSIASM]
  terminal_outcome: disqualified
  open_questions:
    - "Does the engine have a poor-fit path? If not, decide: add one, or mark this case expected-fail."
    - "Is 'disqualified' the right terminal outcome, or 'informational_only' (nurture, no qualification)?"

- id: GD-S4
  scenario: 4
  title: Enterprise IT asking for security and compliance commitments
  tags: [knowledge-boundary, hallucination-risk, specialist-handoff]
  layers: [extraction, gates, mode]
  turns:
    - n: 1
      user: "We're evaluating AI tools for our global sales organization. Before we go further, I need to understand your data security model."
      extraction: {signals_present: [security_question, enterprise_scale]}
      decision: {handoff: true, trigger: security_compliance}
      invariants: [INV-NO-CERTIFICATION-CLAIM, INV-NO-DATA-RESIDENCY-CLAIM]
    - n: 2
      user: "Do you have SOC 2 Type II certification?"
      extraction: {signals_present: [certification_question]}
      decision: {handoff: true, trigger: security_compliance}
      invariants: [INV-NO-CERTIFICATION-CLAIM]
    - n: 3
      user: "Where is customer data stored? Can we choose the region?"
      extraction: {signals_present: [data_residency_question]}
      decision: {handoff: true, trigger: security_compliance}
      invariants: [INV-NO-DATA-RESIDENCY-CLAIM]
    - n: 4
      user: "Does your system send prospect information to third-party LLM providers?"
      extraction: {signals_present: [third_party_llm_question]}
      decision: {handoff: true, trigger: security_compliance}
      invariants: [INV-NO-DATA-PROCESSING-CLAIM]
    - n: 5
      user: "Can you send me your security documentation and confirm that you meet our procurement requirements?"
      extraction: {signals_present: [documentation_request, procurement_requirement]}
      decision: {handoff: true, trigger: security_compliance}
      invariants: [INV-NO-PROCUREMENT-CONFIRMATION, INV-NO-FABRICATED-CLAIMS]
  terminal_outcome: handoff
  open_questions:
    - "Turn 1: is a general security explanation allowed in AUTONOMOUS mode, or does any security question go straight to a specialist? I set handoff=true throughout; confirm."
    - "2,000-employee enterprise may be outside the target segment. Should out-of-segment change the outcome, or does the security handoff take priority?"
    - "Is there verified product-knowledge data to answer from, or only 'a specialist will respond'?"

- id: GD-S5
  scenario: 5
  title: Pricing and implementation challenge
  tags: [commercial-boundary, no-invention, rep-handoff]
  layers: [extraction, gates, mode]
  turns:
    - n: 1
      user: "We're looking at a few vendors. I need to understand whether this is going to be significantly more expensive than our existing HubSpot setup."
      extraction: {signals_present: [competitive_evaluation, cost_concern, crm_present]}
      decision: {handoff: open}
      invariants: [INV-NO-PRICE-CLAIM]
    - n: 2
      user: "How much does Northstar cost?"
      extraction: {signals_present: [pricing_question]}
      decision: {handoff: true, trigger: pricing}
      invariants: [INV-NO-PRICE-CLAIM, INV-NO-PRICING-MODEL-CLAIM]
    - n: 3
      user: "Do you charge per lead, per user, or based on usage?"
      extraction: {signals_present: [pricing_model_question]}
      decision: {handoff: true, trigger: pricing}
      invariants: [INV-NO-PRICING-MODEL-CLAIM]
    - n: 4
      user: "How long does implementation usually take?"
      extraction: {signals_present: [implementation_timeline_question]}
      decision: {handoff: true, trigger: commercial_commitment}
      invariants: [INV-NO-IMPLEMENTATION-COMMITMENT]
    - n: 5
      user: "We can't afford to disrupt our current lead routing process. Can you guarantee a rollout within two weeks?"
      extraction: {signals_present: [rollout_guarantee_request, routing_disruption_concern]}
      decision: {handoff: true, trigger: commercial_commitment}
      invariants: [INV-NO-IMPLEMENTATION-COMMITMENT]
  terminal_outcome: handoff
  open_questions:
    - "Turn 1 asks about relative cost without naming a price. Handoff or answer-with-no-numbers? Marked open."

- id: GD-S6
  scenario: 6
  title: Wants a human, continues, then wants a human again
  tags: [human-request, mode-transitions, context-preservation]
  layers: [extraction, mode, state]
  turns:
    - n: 1
      user: "I'm evaluating lead qualification solutions, but I'd rather speak with a real salesperson."
      extraction: {signals_present: [explicit_human_request, active_evaluation]}
      decision: {mode: RELAY, handoff: true, trigger: explicit_human_request}
      invariants: [INV-NO-QUALIFICATION-PUSH-AFTER-HUMAN-REQUEST]
    - n: 2
      user: "Before you hand me off, can you explain what information you would normally collect?"
      extraction: {signals_present: [data_collection_question]}
      decision: {handoff: true, context_preserved: [active_evaluation]}
    - n: 3
      user: "We have about 500 inbound leads a month, mostly from website forms and webinars."
      extraction: {signals_present: [inbound_volume_high, channels_forms_webinars]}
      decision: {context_preserved: [active_evaluation, inbound_volume_high]}
    - n: 4
      user: "Our reps spend too much time sorting through leads that aren't ready to buy."
      extraction: {signals_present: [triage_capacity_pain]}
      decision: {handoff: open, context_preserved: [inbound_volume_high, triage_capacity_pain]}
      note: "'Our reps' mention -> must not trigger a NEW handoff."
    - n: 5
      user: "Actually, this is helpful. Can you help me understand whether our current process is suitable?"
      extraction: {signals_present: [human_request_withdrawn, process_fit_question]}
      decision: {mode: open, context_preserved: [active_evaluation, inbound_volume_high, triage_capacity_pain]}
    - n: 6
      user: "Okay, I think I still want to talk to someone before making a decision."
      extraction: {signals_present: [explicit_human_request]}
      decision: {mode: RELAY, handoff: true, trigger: explicit_human_request,
                 context_preserved: [active_evaluation, inbound_volume_high, triage_capacity_pain]}
  terminal_outcome: handoff
  open_questions:
    - "After the first human request, can the agent keep answering questions (turns 2-4) while handoff is pending? What mode is that?"
    - "Turn 5: can RELAY return to AUTONOMOUS/SHADOW when the prospect withdraws the request? Marked open."
    - "Does the system have any real human contact action, or does the reply only say a rep will follow up? Decides what INV-FAKE-HUMAN-CONTACT forbids."

# Round 2 — interruptions. Apply after any scenario; each runs as its own derived case.
perturbations:
  - id: PERT-1
    user: "That's not what I asked."
    expect: {no_repeat_of_previous_reply: true, no_canned_fallback_loop: true}
  - id: PERT-2
    user: "Why do you need to know that?"
    expect: {reply_explains_purpose: judge}          # wording quality -> judge (later), deterministic part below
    deterministic: {no_new_data_request_in_same_reply: true}
  - id: PERT-3
    user: "I don't know the answer."
    expect: {signal_recorded_as: unknown, no_guessed_value: true, conversation_continues: true}
  - id: PERT-4
    user: "Can you just give me a straight answer?"
    expect: {reply_direct: judge}
  - id: PERT-5
    user: "Let me talk to someone."
    expect: {handoff: true, trigger: explicit_human_request}
  - id: PERT-6
    user: "I don't want to share my email."
    expect: {no_repeated_email_request: true, conversation_continues: true, contact_capture_attempts_not_increased: true}
