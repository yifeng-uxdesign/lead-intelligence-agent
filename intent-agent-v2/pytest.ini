[pytest]
# Test discovery
testpaths = tests

# Python path — treat project root as the import root so
# "from src.orchestrator import ..." resolves correctly
pythonpath = .

# Output format
addopts =
    --tb=short
    -v

# Test file naming convention
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers — register custom markers to avoid warnings
# Run by layer:
#   pytest -m unit        → state machines, trigger catalog, handoff logic
#   pytest -m behavior    → soul.md compliance checks
#   pytest -m persona     → archetypal conversation simulations
markers =
    unit: low-level logic tests for state machines and domain rules
    behavior: soul.md compliance tests for agent output
    persona: end-to-end archetypal prospect conversation simulations
